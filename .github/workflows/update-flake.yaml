name: Update flake inputs

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - run: nix flake update
      - run: nix flake check -L
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676
        with:
          branch: update-flake-lock
          title: "chore: update flake.lock"
          commit-message: "chore: update flake.lock"
          body: >
            Automated weekly flake input update. `nix flake check` (package
            build + VM test + formatting) passed in the workflow run that
            opened this PR.
